<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="robots" content="noindex,follow">
<title>Página não encontrada | Suellen Melo Advogada</title>
<link rel="icon" type="image/webp" href="/favicon-novo.webp">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F9F6F0;--ink:#2b2b2b;--mut:#6b6558;--gold:#B89A5A;--gold2:#D4AF37;--gold-deep:#7D6220;--blk:#0A0A0A;--line:rgba(184,154,90,.45);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 22px;text-align:center}
.logo-img{width:64px;height:64px;object-fit:contain;margin-bottom:24px}
.eyebrow{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-deep);font-weight:600}
h1{font-family:var(--serif);font-weight:600;line-height:1.1;font-size:clamp(2.4rem,7vw,4rem);margin:14px 0 12px;color:var(--ink)}
p{color:var(--mut);max-width:480px;margin:0 auto 32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 30px;border-radius:999px;font-weight:600;font-size:.88rem;letter-spacing:.04em;background:var(--gold);color:#0A0A0A;border:1px solid var(--gold);text-decoration:none;transition:background .25s,transform .25s}
.btn:hover{background:var(--gold2);transform:translateY(-2px)}
</style>
</head>
<body>
  <img src="/favicon-96.webp" alt="Logo Suellen Melo" class="logo-img" width="64" height="64">
  <div class="eyebrow">Erro 404</div>
  <h1>Página não encontrada</h1>
  <p>O endereço que você tentou acessar não existe ou foi movido. Volte à página inicial para continuar navegando.</p>
  <a class="btn" href="/">Voltar ao site</a>
</body>
</html>
